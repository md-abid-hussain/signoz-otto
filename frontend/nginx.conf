# nginx serves the built SPA and does what the Vite dev proxy did: /api → backend, /otlp → SigNoz.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API → Otto backend
  location /api/ {
    proxy_pass http://otto-app:8010;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;            # let SSE stream through
    proxy_read_timeout 600s;
  }

  # browser RUM OTLP → SigNoz collector (override target with the OTLP_TARGET build/run arg if needed)
  location /otlp/ {
    rewrite ^/otlp/(.*) /$1 break;
    proxy_pass http://host.docker.internal:4318;
    proxy_set_header Host $host;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
